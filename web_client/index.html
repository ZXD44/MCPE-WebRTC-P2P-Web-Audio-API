<!DOCTYPE html>
<html lang="th" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat — Minecraft Bedrock Roleplay</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mf-canvas-background"></div>

    <div class="app-layout">
        <!-- Minimal Frosted Navigation Bar -->
        <header class="mf-navbar">
            <div class="mf-brand">
                <div class="mf-brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" x2="12" y1="19" y2="22"></line>
                    </svg>
                </div>
                <div class="mf-brand-info">
                    <span class="mf-brand-name">BedrockVoice</span>
                    <span class="mf-badge-tag">v1.0 · Spatial 3D</span>
                </div>
            </div>

            <div class="mf-status-pill" id="connectionBadge">
                <span class="mf-status-indicator"></span>
                <span class="mf-status-label" id="connectionText">Offline</span>
            </div>
        </header>

        <!-- Main Panel: Joined Players Only -->
        <main class="mf-main">
            <div class="mf-card mf-players-card">
                <div class="mf-card-header">
                    <div class="mf-card-title-group">
                        <h2 class="mf-card-title">ผู้เล่นที่เข้าร่วมไมค์ (Joined Players)</h2>
                        <span class="mf-count-tag" id="nearbyCountBadge">0 online</span>
                    </div>
                    <span class="mf-subtext" id="playerSelectHint">ตรวจจับคนใกล้เคียงอัตโนมัติ</span>
                </div>

                <!-- Hidden element stubs to maintain JS compatibility -->
                <div style="display: none;">
                    <input type="text" id="playerNameInput" value="">
                    <datalist id="onlinePlayersList"></datalist>
                    <button id="btnRefreshPlayers"></button>
                    <button id="btnConnect"><span id="connectBtnIcon"></span><span id="connectBtnText"></span></button>
                    <button id="btnToggleMute"><span id="muteIcon"></span><span id="muteText"></span></button>
                    <span id="micDbText"></span>
                    <div id="micMeterFill"></div>
                </div>

                <!-- Active Joined Players List -->
                <div class="mf-speakers-container" id="speakersList">
                    <div class="mf-empty">
                        <div class="mf-empty-icon">🎧</div>
                        <div class="mf-empty-text">ยังไม่มีผู้เล่นอื่นเชื่อมต่อในบริเวณนี้</div>
                        <div class="mf-empty-sub">เมื่อผู้เล่นอื่นเข้าใกล้ในเกม รายชื่อและระยะห่างจะแสดงที่นี่โดยอัตโนมัติ</div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Minimal Clean Footer -->
        <footer class="mf-footer">
            <span>Powered by WebRTC P2P &amp; Web Audio API</span>
            <span>Built by <strong>ZirconX</strong></span>
        </footer>
    </div>

    <!-- Scripts -->
    <script src="js/occlusion_filter.js"></script>
    <script src="js/audio_engine.js"></script>
    <script src="js/webrtc_manager.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
